<h1>CRM — клиенты</h1>

<div class="client-form">
  <input
    type="text"
    placeholder="Имя клиента"
    [(ngModel)]="newName"
  />

  <input
    type="text"
    placeholder="Телефон"
    [(ngModel)]="newPhone"
  />

  <button
    (click)="addClient()"
    [disabled]="!newName.trim()"
  >
    Добавить клиента
  </button>
</div>

@if (clientsService.loading()) {
  <p>Загрузка клиентов...</p>
}

@if (clientsService.error(); as error) {
  <p class="error">{{ error }}</p>
}

<div class="clients-list">
  @for (client of clientsService.clients(); track client.id) {
    <app-client-card
      [client]="client"
      (delete)="deleteClient($event)"
    />
  } @empty {
    @if (!clientsService.loading()) {
      <p>Клиентов пока нет.</p>
    }
  }
</div>
